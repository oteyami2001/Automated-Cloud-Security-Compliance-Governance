# Drift detection (scenario 15, Phase 8). Read-only: `tf_ci.sh drift` runs `terraform plan
# -detailed-exitcode` with the read-only plan role and never applies. Drift prints addresses and
# actions only (no IDs) and opens or updates one issue. Restoring is always a reviewed plan/apply.
name: drift-detection

on:
  workflow_dispatch: # dev only; staging/prod are reference configurations (ADR 0002)
  # schedule paused: the dev stack was destroyed in Phase 9 (evidence P9-3). Restore these two lines
  # after a rebuild (docs/rebuild.md):
  # schedule:
  #   - cron: "23 5 * * 1" # Mondays 05:23 UTC

permissions: {}

concurrency:
  group: terraform-dev # never in parallel with a plan or apply on the same state
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: "1.17.2"
  AWS_REGION: us-east-2

jobs:
  drift:
    name: drift (dev)
    runs-on: ubuntu-24.04
    environment: dev-plan
    permissions:
      contents: read
      id-token: write
    outputs:
      drift: ${{ steps.drift.outputs.drift }}
      addresses: ${{ steps.drift.outputs.addresses }}
    steps:
      - name: Environment secrets present
        env:
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          [[ $ACCOUNT_ID =~ ^[0-9]{12}$ ]] || { echo "::error::secret AWS_ACCOUNT_ID is missing or not 12 digits in this environment"; exit 1; }
          [ -n "$ALERT_EMAIL" ] || { echo "::error::secret ALERT_EMAIL is missing in this environment"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Install pinned, hash-verified dependencies
        run: python -m pip install --require-hashes --no-deps -r requirements-dev.lock
      - name: Build the Lambda package (reproducible)
        run: python scripts/build_lambda.py
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/acscg-github-dev-plan
          role-session-name: acscg-drift-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: Detect drift (read-only)
        id: drift
        env:
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_IN_AUTOMATION: "1"
          APPROVERS: ${{ secrets.APPROVERS }} # the same inputs as terraform-plan, or the policy would always "drift"
        run: |
          if [ -n "$APPROVERS" ]; then TF_VAR_approvers=$(python scripts/normalise_approvers.py) || exit 1; export TF_VAR_approvers; fi
          set +e
          bash scripts/tf_ci.sh drift dev | tee drift.txt
          code=${PIPESTATUS[0]}
          set -e
          case $code in
            0) echo "drift=false" >>"$GITHUB_OUTPUT" ;;
            3)
              echo "drift=true" >>"$GITHUB_OUTPUT"
              { echo "addresses<<ACSCG_EOF"; grep -E '^- ' drift.txt | head -50; echo "ACSCG_EOF"; } >>"$GITHUB_OUTPUT"
              ;;
            *) exit "$code" ;;
          esac
          { echo "### Drift detection (dev)"; echo '```'; cat drift.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"

  issue:
    name: open or update the drift issue
    needs: drift
    if: needs.drift.outputs.drift == 'true'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open or update the issue (addresses only)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ADDRESSES: ${{ needs.drift.outputs.addresses }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Drift detected in dev"
          body=$(printf 'Terraform plan found changes outside the pipeline (addresses and actions only):\n\n%s\n\nRun: %s\n\nRestore with a reviewed terraform-plan / terraform-apply, or adopt the change in code. Never apply without review.\n' "$ADDRESSES" "$RUN_URL")
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then gh issue comment "$number" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
