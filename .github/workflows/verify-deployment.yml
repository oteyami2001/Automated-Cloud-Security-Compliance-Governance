# Read-only verification of the dev deployment and the validation scenarios (scripts/verify_deployment.py).
# Uses the read-only plan role (environment dev-plan, main only). Prints PASS/FAIL lines with fixture
# names only: no account IDs, resource IDs or ARNs.
name: verify-deployment

on:
  workflow_dispatch: # dev only; staging/prod are reference configurations (ADR 0002)
  # schedule paused: the dev stack was destroyed in Phase 9 (evidence P9-3). Restore these two lines
  # after a rebuild (docs/rebuild.md):
  # schedule:
  #   - cron: "11 7 * * *" # daily, after the 06:17 UTC report (Phase 8)

permissions: {}

concurrency:
  group: verify-dev
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2

jobs:
  verify:
    name: verify (dev)
    runs-on: ubuntu-24.04
    environment: dev-plan
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Environment secrets present
        env:
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          [[ $ACCOUNT_ID =~ ^[0-9]{12}$ ]] || { echo "::error::secret AWS_ACCOUNT_ID is missing or not 12 digits in this environment"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install pinned, hash-verified dependencies
        run: python -m pip install --require-hashes --no-deps -r requirements-dev.lock
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/acscg-github-dev-plan
          role-session-name: acscg-verify-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: Verify (read-only)
        run: |
          set -o pipefail
          python scripts/verify_deployment.py --env dev --region "$AWS_REGION" | tee verify.txt
      - name: Job summary
        if: always()
        run: |
          { echo "### Deployment verification (dev)"; echo '```'; cat verify.txt 2>/dev/null || echo "no output"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
