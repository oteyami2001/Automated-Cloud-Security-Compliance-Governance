# Remediation policy source for staging. Terraform renders it with templatefile() into the SSM parameter
# /acscg/staging/platform-policy, adding: approvers (sensitive TF_VAR), project_inventory,
# approved_change_principals and project_role_arns. ${account_id} and ${region} are template variables.
# Validated by policies/schemas/remediation-policy.schema.json and remediation_engine.policy.parse_policy.
environment: staging
remediation_enabled: false        # report-only by default (ADR 0006); a window is opened by PR + reviewed apply
remediation_mode: report_only     # report_only | auto_low_risk | human_approval
approval:
  timeout_minutes: 240
limits:
  max_attempts_per_finding: 2
allowlist: []                     # exact ARNs only; see docs/remediation-runbook.md §2
protected_resources: []           # pre-existing resources from discovery (D13): never remediated
